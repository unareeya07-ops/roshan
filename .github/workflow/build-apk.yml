name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install dependencies
        run: npm install
      - name: Add Android platform
        run: npx cap add android
      - name: Install image tooling
        run: python3 -m pip install Pillow
      - name: Add Android camera permission
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          text = p.read_text()
          permission = '<uses-permission android:name="android.permission.CAMERA" />'
          if permission not in text:
              text = text.replace('<application', permission + '\n    <application', 1)
              p.write_text(text)
          PYCODE
      - name: Apply SOH app launcher icon
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          from PIL import Image
          source = Image.open('assets/icon.png').convert('RGBA')
          sizes = {'mdpi': 48, 'hdpi': 72, 'xhdpi': 96, 'xxhdpi': 144, 'xxxhdpi': 192}
          for density, size in sizes.items():
              folder = Path(f'android/app/src/main/res/mipmap-{density}')
              folder.mkdir(parents=True, exist_ok=True)
              icon = source.resize((size, size), Image.Resampling.LANCZOS)
              icon.save(folder / 'ic_launcher.png')
              icon.save(folder / 'ic_launcher_round.png')
          PYCODE
      - name: Sync app assets
        run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SOH-Style-Scanner-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

